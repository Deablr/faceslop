<!doctype html>
<!-- Mimics a logged-in Marketplace listing page with the inline "Send seller a message" box.
     Markup follows Facebook's Comet patterns (role=main, div[role=button] with aria-label,
     nested spans, a textarea prefilled with "Hi, is this available?"). Test-only hooks:
     window.__mode, window.__sent, window.__sendClicks. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marketplace – White Desk | Facebook</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  div[role="banner"] { height: 56px; background: #fff; border-bottom: 1px solid #ddd; }
  div[role="button"] { display: inline-block; padding: 6px 12px; background: #e4e6eb; border-radius: 6px; cursor: pointer; }
  div[role="button"][aria-disabled="true"] { opacity: 0.4; }
  .x-mobile-only { display: none; }
  textarea { width: 300px; }
</style>
</head>
<body>
<div role="banner">
  <a href="/" aria-label="Facebook">f</a>
  <input type="search" role="combobox" aria-label="Search Facebook" placeholder="Search Facebook">
</div>
<div role="main">
  <div class="x9f619 x1n2onr6">
    <h1><span dir="auto">White Desk with monitor stand and shelf</span></h1>
    <span dir="auto">$35</span>
    <div><div role="button" aria-label="Message" tabindex="0"><span>Message</span></div>
      <div role="button" aria-label="Save" tabindex="0"><span>Save</span></div>
      <div role="button" aria-label="Share" tabindex="0"><span>Share</span></div></div>

    <!-- A hidden duplicate (Facebook renders some blocks twice for different layouts). -->
    <div class="x-mobile-only">
      <div><span dir="auto"><span>Send seller a message</span></span></div>
      <label><textarea data-fixture="hidden-textarea">Hi, is this available?</textarea></label>
      <div role="button" aria-label="Send" tabindex="0" data-fixture="hidden-send"><span>Send</span></div>
    </div>

    <div class="x1yztbdb">
      <div class="x78zum5 x1q0g3np" data-fixture="composer">
        <div class="x1iyjqo2">
          <div class="x6s0dn4"><i data-visualcompletion="css-img"></i><span dir="auto"><span class="x193iq5w">Send seller a message</span></span></div>
          <div class="x1n2onr6"><div><label class="x1a2a7pz"><textarea dir="ltr" rows="1" class="x1i10hfl">Hi, is this available?</textarea></label></div></div>
          <div class="x1n2onr6"><div><div aria-label="Send" role="button" tabindex="0" data-fixture="send"><div role="none"><span dir="auto"><span>Send</span></span></div></div></div></div>
        </div>
      </div>
    </div>

    <h2><span>Details</span></h2>
    <span dir="auto">Pre built white desk, good for small spaces. Barely used.</span>
    <h2><span>Seller information</span></h2>
    <div role="button" tabindex="0"><span>Jackie</span></div>
    <h2><span>Today's picks</span></h2>
    <a href="/marketplace/item/999/"><span>Office chair</span></a>
    <div role="button" aria-label="Message" tabindex="0"><span>Message</span></div>
  </div>
</div>
<script>
  window.__sent = [];
  window.__sendClicks = 0;
  window.__hiddenSendClicks = 0;
  window.__mode = 'ok';
  const box = document.querySelector('[data-fixture="composer"]');
  const textarea = box.querySelector('textarea');
  const send = box.querySelector('[data-fixture="send"]');
  textarea.addEventListener('input', () => send.setAttribute('aria-disabled', String(!textarea.value.trim())));
  document.querySelector('[data-fixture="hidden-send"]').addEventListener('click', () => window.__hiddenSendClicks++);

  send.addEventListener('click', () => {
    if (send.getAttribute('aria-disabled') === 'true') return;
    window.__sendClicks++;
    window.__sent.push(textarea.value);
    const mode = window.__mode;
    if (mode === 'silent') return;
    if (mode === 'error') {
      const alert = document.createElement('div');
      alert.setAttribute('role', 'alert');
      alert.textContent = "Couldn't send message. Please try again.";
      document.body.append(alert);
      return;
    }
    if (mode === 'ok' || mode === 'gql-error') {
      const body = new URLSearchParams({ fb_api_req_friendly_name: 'useMarketplaceSendMessageMutation', variables: '{}' });
      fetch('/api/graphql/', { method: 'POST', headers: { 'x-fb-friendly-name': 'useMarketplaceSendMessageMutation' }, body });
      if (mode === 'gql-error') return;
    }
    // Facebook swaps the box for a "sent" state.
    setTimeout(() => {
      box.innerHTML = '<div><span dir="auto">Message sent</span></div><a href="/messages/t/42/" role="link"><span>See conversation</span></a>';
    }, mode === 'ok' ? 1500 : 200);
  });
</script>
</body>
</html>
